name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386
          - goos: windows
            goarch: 386

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output_name="hashline_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            output_name="$output_name.exe"
          fi
          go build -ldflags="-s -w" -o "$output_name" hashline.go

      - name: Package Node.js fallback
        run: |
          tar -czf hashline_nodejs_linux_amd64.tar.gz hashline.js package.json

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            hashline_${{ matrix.goos }}_${{ matrix.goarch }}*
            hashline_nodejs_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"

          # Find all built binary files and the Node.js tarball
          mapfile -t assets < <(find artifacts -type f \( -name 'hashline_*' -o -name 'hashline_nodejs_*.tar.gz' \) | sort)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No assets found!"
            exit 1
          fi

          echo "Found ${#assets[@]} asset(s):"
          printf '%s\n' "${assets[@]}"

          # Create release and upload all assets in one command
          gh release create "$TAG" "${assets[@]}" --generate-notes
