name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386
          - goos: windows
            goarch: 386

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          output_name="hashline_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "$GOOS" = "windows" ]; then
            output_name="$output_name.exe"
          fi
          go build -ldflags="-s -w" -o "$output_name" hashline.go

      - name: Package Node.js fallback
        run: |
          tar -czf hashline_nodejs_linux_amd64.tar.gz hashline.js package.json

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            hashline_${{ matrix.goos }}_${{ matrix.goarch }}*
            hashline_nodejs_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG_NAME"
          # Find all binary files in the artifacts directory
          find artifacts -type f \( -name 'hashline_*' -o -name 'hashline_nodejs_*.tar.gz' \) -print0 | sort -z | xargs -0 -I{} echo "Found asset: {}"
          ASSETS=$(find artifacts -type f \( -name 'hashline_*' -o -name 'hashline_nodejs_*.tar.gz' \) | tr '\n' ' ')
          if [ -z "$ASSETS" ]; then
            echo "No assets found to upload!"
            exit 1
          fi
          # Create release and upload assets in one command
          gh release create "$TAG_NAME" $ASSETS --generate-notes --latest
