name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
         #!/usr/bin/env bash
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              # Skip unsupported combinations
              if [[ "$os" == "darwin" && "$arch" == "386" ]] || [[ "$os" == "windows" && "$arch" == "386" ]]; then
                continue
              fi
              GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "hashline_${os}_${arch}" hashline.go
            done
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hashline_linux_amd64
            hashline_linux_arm64
            hashline_darwin_amd64
            hashline_darwin_arm64
            hashline_windows_amd64.exe
          generate_release_notes: true
